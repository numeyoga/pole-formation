openapi: 3.1.0
info: {title: Pôle formation — catalogue de formations, version: 0.1.0}
servers: [{url: /}]
security: [{session: []}]
paths:
  /api/formations:
    get:
      description: Catalogue paginé pour gestionnaire et administrateur, tous états y compris archivés et formations sans session. Recherche littérale par sous-chaîne de code ou intitulé sans casse, espaces externes retirés, vide pour tout le catalogue. Tri par code sans casse puis identifiant.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200, default: ''}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Page du catalogue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      description: Crée une formation Brouillon. Code réservé sans casse, y compris après archivage. Création auditée atomiquement.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Fields'}
      responses:
        '201':
          description: Formation créée
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Formation'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/formations/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      responses:
        '200':
          description: Fiche, y compris archivée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Formation'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      description: Modifie les champs, en conservant identité et état. Version obligatoire ; modification auditée.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Fields'}
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer, format: int64, minimum: 0}
      responses:
        '204': {description: Formation modifiée}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/formations/{id}/activation:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      description: Brouillon vers Active. Version obligatoire, transition auditée atomiquement.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Version'}
      responses:
        '204': {description: Transition effectuée}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/formations/{id}/archivage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      description: Brouillon ou Active vers Archivée, historique inchangé. Version obligatoire, transition auditée atomiquement.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Version'}
      responses:
        '204': {description: Transition effectuée}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/formations/{id}/reactivation:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      description: Archivée vers Active, champs obligatoires, code unique et cohérence contrôlés. Version obligatoire, transition auditée atomiquement.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Version'}
      responses:
        '204': {description: Transition effectuée}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/formations/{id}/sessions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      responses:
        '200':
          description: Sessions conservées quel que soit l’état de la formation, triées par intitulé sans casse puis identifiant
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Session'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      description: Raccordement minimal de session Brouillon. Formation Active obligatoire, vérifiée sous le même verrou que l’archivage. Planification complète dans US-05.01.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Session Brouillon créée et rattachée à la formation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/formations/competences-disponibles:
    get:
      description: Compétences actives, recherche littérale par code ou libellé, tri par libellé sans casse puis identifiant. Gestionnaire et administrateur.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: q, in: query, schema: {type: string, maxLength: 200, default: ''}}
      responses:
        '200':
          description: Choix paginés
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Choices'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/formations/{id}/competences:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      description: Liens conservés pour tous les états de formation et compétences inactives incluses, tri par libellé de compétence sans casse puis identifiant du lien.
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Compétences associées paginées
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoveragePage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      description: Associe une compétence active à une formation Active, sans niveau ni classification. Contrôles et insertion atomiques avec verrouillage des deux références ; doublon refusé. Gestionnaire et administrateur.
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competencyId]
              properties:
                competencyId: {type: string, format: uuid}
      responses:
        '201':
          description: Association créée
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Coverage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: JSESSIONID}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Csrf: {name: X-CSRF-TOKEN, in: header, required: true, schema: {type: string}}
  responses:
    Error:
      description: Erreur de format, champ, droits, ressource absente, code réservé, transition interdite ou version périmée
      content:
        application/problem+json:
          schema:
            type: object
            required: [status]
            properties:
              status: {type: integer}
              detail: {type: string}
              fieldErrors: {type: object, additionalProperties: {type: string}}
  schemas:
    Fields:
      type: object
      required: [code, title]
      properties:
        code: {type: string, minLength: 1, maxLength: 64}
        title: {type: string, minLength: 1, maxLength: 200}
        objectives: {type: string, maxLength: 4000, default: ''}
        description: {type: string, maxLength: 4000, default: ''}
        durationMinutes: {type: [integer, 'null'], minimum: 1, maximum: 2147483647}
    Formation:
      allOf:
        - {$ref: '#/components/schemas/Fields'}
        - type: object
          required: [id, code, title, objectives, description, durationMinutes, state, version]
          properties:
            id: {type: string, format: uuid}
            state: {type: string, enum: [BROUILLON, ACTIVE, ARCHIVEE]}
            version: {type: integer, format: int64, minimum: 0}
    Version:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0}
    Page:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Formation'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    Session:
      type: object
      required: [id, title, state]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        state: {type: string, enum: [BROUILLON, PLANIFIEE, TERMINEE, ANNULEE]}
    Coverage:
      type: object
      required: [id, competencyId, competencyCode, competencyLabel, active]
      properties:
        id: {type: string, format: uuid}
        competencyId: {type: string, format: uuid}
        competencyCode: {type: string}
        competencyLabel: {type: string}
        active: {type: boolean}
    CoveragePage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Coverage'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    Choice:
      type: object
      required: [id, code, label]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
    Choices:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Choice'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
